    <!-- Дизайн-система (docs/design-system.md): шрифт IBM Plex Mono, размеры, цвета и панели в src/ui/design.css -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111;
      }
      canvas {
        display: block;
      }
      #fullscreenBtn {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 10;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 6px;
        font-family: var(--font);
        font-size: var(--fs-text);
        cursor: pointer;
      }
      #fullscreenBtn:hover {
        background: rgba(50, 50, 50, 0.85);
      }
      #mouseHint {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-family: var(--font);
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 12px;
        border-radius: 6px;
        z-index: 10;
        pointer-events: none;
        display: none;
      }
      /* Слева сверху: инвентарь */
      #topLeft {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 11;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      /* Кошелек рядом с телефоном: значок и сумма одним блоком (src/player/inventory.js, renderWalletHud) */
      #walletHud {
        display: none;
        align-items: center;
        gap: 8px;
        box-sizing: border-box;
        height: 54px;
        padding: 0 12px 0 8px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        background: rgba(10, 14, 20, 0.62);
        color: var(--c-text, #f1f3f5);
        font: 600 var(--fs-h2, 16px) var(--font, monospace);
        font-variant-numeric: tabular-nums;
        user-select: none;
        pointer-events: none;
      }
      #walletHud.on {
        display: flex;
      }
      #walletHud img.px {
        width: 32px;
        height: 32px;
        image-rendering: pixelated;
      }
      #walletHud .amt {
        transition: color 0.4s;
      }
      #walletHud.down .amt {
        color: var(--c-danger, #ff6b5b);
        transition: none;
      }
      #walletHud.up .amt {
        color: var(--c-ok, #3fa35b);
        transition: none;
      }
      #inventory {
        position: relative;
        box-sizing: border-box;
        padding: 6px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        background: rgba(10, 14, 20, 0.62);
        user-select: none;
      }
      #inventory.closed {
        cursor: pointer;
      }
      #inventory .invTop {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      /* Быстрые слоты сохранения под свернутым инвентарем: с небольшим отступом */
      #inventory .invGrid.quick {
        margin-top: 10px;
      }
      #inventory .invCell.quick {
        cursor: pointer;
      }
      #inventory .invCell.quick:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      #inventory .invCell.quick.empty {
        border-style: dashed;
      }
      #inventory .invCell.quick.empty .px {
        opacity: 0.32;
      }
      #inventory.open {
        width: 372px;
      }
      #inventory .invGrid {
        display: grid;
        gap: 4px;
      }
      /* С бесконечным рюкзаком вещей может быть больше 8 × 5: видно 8 строк, остальное прокручивается */
      #inventory.open .invGrid.items {
        max-height: 348px;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      #inventory .invGrid.saves {
        margin-top: 6px;
      }
      #inventory .invCell {
        width: 40px;
        height: 40px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.07);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #inventory .px {
        width: 28px;
        height: 28px;
        image-rendering: pixelated;
        pointer-events: none;
      }
      #inventory .invChevron {
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      #inventory.open .invChevron {
        margin-bottom: 4px;
      }
      #inventory .invChevron .px {
        width: 18px;
        height: 18px;
      }
      #inventory .invTools {
        display: flex;
        gap: 4px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }
      #inventory .invCell.tool {
        cursor: pointer;
      }
      #inventory .invCell.tool:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      #inventory .invCell.tool.active {
        border-color: #ffd84a;
        background: rgba(255, 216, 74, 0.25);
      }
      #inventory .invCell.slot.filled {
        cursor: pointer;
      }
      #inventory .invCell.weatherNow {
        border-color: #8fd0ff;
        background: rgba(143, 208, 255, 0.28);
      }
      #inventory .invWeather {
        margin-top: 8px;
      }
      #inventory .invCell.slot.filled:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      /* Слоты пульсируют, пока ждем клика (сохранить / очистить) */
      #inventory .invCell.slot.pulse {
        cursor: pointer;
        animation: slotPulse 0.9s ease-in-out infinite;
      }
      @keyframes slotPulse {
        0%,
        100% {
          transform: scale(1);
          background: rgba(255, 255, 255, 0.07);
          border-color: rgba(255, 255, 255, 0.28);
        }
        50% {
          transform: scale(1.14);
          background: rgba(255, 216, 74, 0.3);
          border-color: #ffd84a;
        }
      }
      #dialogue {
        position: absolute;
        left: 50%;
        bottom: 84px;
        transform: translateX(-50%);
        z-index: 13;
        display: none;
        width: min(620px, 92vw);
        box-sizing: border-box;
        padding: 14px 18px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 10px;
        background: rgba(10, 14, 20, 0.94);
        color: white;
        font-family: var(--font);
      }
      #dialogue .speaker {
        font-weight: bold;
        color: #8fd0ff;
        margin-bottom: 6px;
      }
      #dialogue .text {
        font-size: var(--fs-h2);
        line-height: 1.45;
        margin-bottom: 10px;
      }
      #dialogue .option {
        margin-top: 5px;
        padding: 7px 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.09);
        cursor: pointer;
      }
      #dialogue .option:hover {
        background: rgba(143, 208, 255, 0.28);
      }
      #dialogue .hint {
        font-size: var(--fs-text);
        opacity: 0.65;
      }
      #settingsBtn {
        position: absolute;
        bottom: 14px;
        left: 14px;
        z-index: 12;
        width: 46px;
        height: 46px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        font-size: var(--fs-display);
        line-height: 1;
        cursor: pointer;
      }
      #settingsBtn:hover {
        background: rgba(60, 60, 60, 0.85);
      }
      #settingsMenu {
        position: absolute;
        bottom: 70px;
        left: 14px;
        z-index: 12;
        display: none;
        width: 250px;
        box-sizing: border-box;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 10px;
        background: rgba(15, 18, 24, 0.92);
        color: white;
        font-family: var(--font);
      }
      #settingsMenu .title {
        font-size: var(--fs-h2);
        font-weight: bold;
        margin-bottom: 12px;
      }
      #settingsMenu .row {
        display: flex;
        justify-content: space-between;
        font-size: var(--fs-text);
        margin-bottom: 6px;
      }
      #settingsMenu input[type='range'] {
        width: 100%;
        cursor: pointer;
      }
      #settingsMenu .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        font-size: var(--fs-text);
        cursor: pointer;
      }
      #settingsMenu .check input {
        cursor: pointer;
      }
      #settingsMenu .hint {
        margin-top: 10px;
        font-size: var(--fs-small);
        opacity: 0.6;
      }
      #fuel {
        position: absolute;
        bottom: 14px;
        left: 70px;
        z-index: 10;
        display: none;
        align-items: center;
        gap: 8px;
        color: white;
        font-family: var(--font);
        font-size: var(--fs-h2);
        background: rgba(0, 0, 0, 0.6);
        padding: 8px 12px;
        border-radius: 8px;
        pointer-events: none;

      #fuel .bar {
        width: 120px;
        height: 12px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 6px;
        overflow: hidden;
      }
      #speedo {
        position: absolute;
        bottom: 68px;
        left: 70px;
        z-index: 10;
        display: none;
        align-items: baseline;
        gap: 6px;
        color: white;
        font-family: var(--font);
        font-size: var(--fs-text);
        background: rgba(0, 0, 0, 0.6);
        padding: 4px 12px;
        border-radius: 8px;
        pointer-events: none;
      }
      #speedo b {
        min-width: 3ch;
        text-align: right;
        font-size: var(--fs-display);
        font-variant-numeric: tabular-nums;
      }
      #fuelFill {
        height: 100%;
        width: 0;
        background: #3fa35b;
      }
      #toast {
        position: absolute;
        bottom: 130px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        color: white;
        font-family: var(--font);
        background: rgba(30, 90, 50, 0.85);
        padding: 8px 14px;
        border-radius: 6px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #hud {
        position: absolute;
        top: 424px;
        right: 10px;
        max-width: 240px;
        text-align: right;
        z-index: 10;
        color: rgba(255, 255, 255, 0.8);
        font-family: var(--font);
        font-size: var(--fs-text);
        background: rgba(0, 0, 0, 0.5);
        padding: 6px 10px;
        border-radius: 6px;
        pointer-events: none;
      }
      #sunTint {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: rgb(255, 244, 214);
        opacity: 0;
        pointer-events: none;
      }
      #rainTint {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: rgb(8, 16, 28);
        opacity: 0;
        pointer-events: none;
      }
      #prompt {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-family: var(--font);
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 12px;
        border-radius: 6px;
        z-index: 10;
        pointer-events: none;
        display: none;
      }
      #minimapWrap {
        position: absolute;
        top: 60px;
        right: 10px;
        width: 320px;
        height: 320px;
        z-index: 10;
        pointer-events: none;
      }
      #minimap {
        display: block;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 10px;
        pointer-events: auto;
      }
      #mmInfo {
        position: absolute;
        top: 388px;
        right: 10px;
        max-width: 300px;
        z-index: 10;
        color: rgba(255, 255, 255, 0.85);
        font-family: var(--font);
        font-size: var(--fs-text);
        text-align: right;
        background: rgba(0, 0, 0, 0.5);
        padding: 4px 10px;
        border-radius: 6px;
        pointer-events: none;
      }
      #clock {
        position: absolute;
        top: 10px;
        right: 64px; /* справа сверху, левее кнопки «на весь экран» */
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        color: white;
        font-family: var(--font);
        background: rgba(0, 0, 0, 0.5);
        padding: 4px 14px;
        border-radius: 8px;
        pointer-events: none;
      }
      #clock .px {
        width: 24px;
        height: 24px;
        image-rendering: pixelated;
      }
      #clockTime {
        white-space: nowrap;
        font-size: var(--fs-h1);
        font-weight: bold;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      #clockDate {
        font-size: var(--fs-text);
        opacity: 0.8;
      }
      #nightTint {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: rgb(4, 8, 26);
        opacity: 0;
        pointer-events: none;
      }
      #travelFade {
        position: absolute;
        inset: 0;
        z-index: 40;
        background: black;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s;
      }
    </style>
