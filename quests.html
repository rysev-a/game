<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Игра-детектив — с квестами</title>
    <!--
      Игра с квестовой системой, пока она не подключена в index.html. Страница берет настоящий index.html,
      дописывает в его конец загрузчик квестов (src/quests/load.js) и открывает результат, поэтому сама
      не устаревает. Когда в index.html появится строка <script src="src/quests/load.js"></script>,
      этот файл можно удалить.
    -->
    <script>
      fetch('index.html')
        .then((r) => r.text())
        .then((html) => {
          html = html.replace('</body>', '<script src="src/quests/load.js"><\/script></body>');
          document.open();
          document.write(html);
          document.close();
        });
    </script>
  </head>
  <body></body>
</html>
