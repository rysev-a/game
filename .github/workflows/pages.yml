name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # вся история: из нее версия и список обновлений

      # The game is plain static files with no build step. Serve it as-is,
      # with ex.html as the start page. Folders starting with a dot
      # (.user, .city, ...) are kept: this deploys without Jekyll.
      - name: Prepare site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          if [ -f _site/ex.html ] && [ ! -f _site/index.html ]; then
            cp _site/ex.html _site/index.html
          fi
          touch _site/.nojekyll

      # Version and version history for the settings menu (src/engine/settings.js): every merge into main
      # is a version 1.<n>; the Russian text for each one comes from changelog.json by PR number.
      - name: Write version.json
        run: |
          export TZ=Europe/Moscow
          git log --first-parent --reverse --date=format-local:'%d.%m.%Y' --format='%cd%x09%s' \
            | jq -R -s -c --arg sha "$(git rev-parse --short HEAD)" '
                split("\n") | map(select(length > 0) | split("\t"))
                | to_entries
                | map({
                    version: "1.\(.key + 1)",
                    date: .value[0],
                    title: (.value[1] | sub(" \\(#[0-9]+\\)$"; "")),
                    pr: ((.value[1] | capture("#(?<n>[0-9]+)") | .n) // null)
                  })
                | reverse
                | {version: .[0].version, date: .[0].date, sha: $sha, changes: .}' > _site/version.json
          head -c 600 _site/version.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
