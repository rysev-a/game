<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Демо: люди</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="../engine/materials.js"></script>
    <script src="person.js"></script>
    <script>
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x334455);

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.5,
        100,
      );
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.GridHelper(20, 20, 0x555555, 0x333333));
      // Свет как в игре (src/engine/scene.js): небо и солнце
      scene.add(new THREE.HemisphereLight(0xffffff, 0xb0aa9e, 0.72));
      const sun = new THREE.DirectionalLight(0xfff4e0, 0.38);
      sun.position.set(30, 60, 18);
      scene.add(sun);

      // Ряд: игрок-гик и все типы людей
      const lineup = [
        createPerson('geek'),
        createPerson('coat'),
        createPerson('police'),
        createPerson('police', { gender: 'female', hairColor: 0x5a3a22 }),
        createPerson('office', { hairColor: 0x1a1a1a, glasses: true }),
        createPerson('casual', { gender: 'female', hairColor: 0xc9a24a, dressColor: 0x3fa35b }),
        createPerson('student', { hairColor: 0x7a2a1a, shirtColor: 0x8a5fc4, bagColor: 0x2a4a6a }),
        createPerson('worker', { hairColor: 0x5a3a22, beard: true }),
        createPerson('elder', { gender: 'female', dressColor: 0x8a5fc4 }),
        createPerson('elder', { beard: true, glasses: true }),
        createPerson('child', { hairColor: 0xc9a24a, shirtColor: 0xe0c341 }),
        createPerson('casual', { hat: 'beanie', hatColor: 0x8a2a2a, shirtColor: 0x4a8a9a }),
      ];
      lineup.forEach((m, i) => {
        m.position.x = (i - (lineup.length - 1) / 2) * 1.1;
        scene.add(m);
      });
      const man = lineup[0];

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();
      (function loop() {
        requestAnimationFrame(loop);
        const t = clock.getElapsedTime();
        lineup.forEach((m, i) => m.updateWalk(t * 6 + i)); // частота шагов
        const a = Math.PI + Math.sin(t * 0.3) * 0.6; // камера покачивается перед рядом (люди смотрят в -Z)
        camera.position.set(Math.sin(a) * 9, 2.4, Math.cos(a) * 9);
        camera.lookAt(0, 1, 0);
        renderer.render(scene, camera);
      })();
    </script>
  </body>
</html>
