name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # вся история: из нее версия и список обновлений

      # The game is plain static files with no build step. Serve it as-is,
      # with ex.html as the start page. Folders starting with a dot
      # (.user, .city, ...) are kept: this deploys without Jekyll.
      - name: Prepare site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          if [ -f _site/ex.html ] && [ ! -f _site/index.html ]; then
            cp _site/ex.html _site/index.html
          fi
          touch _site/.nojekyll

      # Version and version history for the settings menu (src/engine/settings.js): every commit on main
      # (first parent) is a version 1.<n>; the Russian text for each one comes from changelog.json
      # by PR number or by version. The same script writes version.json locally (tools/version.js).
      - name: Write version.json
        run: |
          node tools/version.js _site/version.json
          head -c 600 _site/version.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
